      if (!token) {
        // Redirect to login if no token
        window.location.href = "login.html";
      }

      // Function to parse JWT and check expiration
      function isTokenExpired(token) {
        try {
          const payload = JSON.parse(atob(token.split('.')[1]));
          const expiry = payload.exp * 1000; // Convert to milliseconds
          return Date.now() > expiry;
        } catch (e) {
          return true; // If parsing fails, consider it expired
        }
      }

      // Check token validity
      if (token && isTokenExpired(token)) {
        localStorage.removeItem("token");
        localStorage.removeItem("username");
        alert("Session expired. Please log in again.");
        window.location.href = "login.html";
      }

      const WS_URL = "ws://192.168.196.213:8080"; // change to localhost if needed

      var socket = null;
      const wsPendingRequests = {};
      function sendWsRequest(action, payload = {}, timeout = 5000) {
        return new Promise((resolve, reject) => {
          const id = Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
          const timer = setTimeout(() => {
            delete wsPendingRequests[id];
            reject(new Error('WS request timeout'));
          }, timeout);
          wsPendingRequests[id] = { resolve, reject, timer };
          const msg = { id, action, payload };
          try {
            if (socket && socket.readyState === WebSocket.OPEN) socket.send(JSON.stringify(msg));
            else throw new Error('Socket not open');
          } catch (err) {
            clearTimeout(timer);
            delete wsPendingRequests[id];
            reject(err);
          }
        });
      }

      function kuld() {
        const input = document.getElementById("uzi");
        if (!input || input.value.trim() === "") return;

        // Read token/username at send-time to avoid temporal-dead-zone issues
        const _token = localStorage.getItem("token");
        const _username = localStorage.getItem("username") || "Unknown";

        // Verify token before sending
        if (!_token || isTokenExpired(_token)) {
          localStorage.removeItem("token");
          localStorage.removeItem("username");
          alert("Session expired. Please log in again.");
          window.location.href = "login.html";
          return;
        }

        if (socket && socket.readyState === WebSocket.OPEN) {
          // Include username in the message
          const messageWithUser = `${_username}: ${input.value}`;
          socket.send(messageWithUser);
        }
        if (input) input.value = "";
      }

      function kuld2(asd) {
        if (socket && socket.readyState === WebSocket.OPEN) {
          socket.send(asd);
        }
      }

      const list = document.getElementById("list");
      function addMessage(message) {
        const li = document.createElement("li");
        li.className = 'message';
        const myName = localStorage.getItem('username') || '';
        const sepIndex = message.indexOf(':');
        if (sepIndex > 0) {
          const sender = message.substring(0, sepIndex).trim();
          const text = message.substring(sepIndex + 1).trim();
          const meta = document.createElement('div');
          meta.className = 'meta';
          meta.textContent = sender;
          const body = document.createElement('div');
          body.textContent = text;
          li.appendChild(meta);
          li.appendChild(body);
          if (sender === myName) li.classList.add('mine'); else li.classList.add('other');
        } else {
          li.textContent = message;
          li.classList.add('other');
        }
        list.appendChild(li);
        li.scrollIntoView({behavior:'smooth', block:'end'});
      }
    </script>
    

    <div class="typing-bar">
      <div class="typing-inner">
        <input type="text" name="uzi" id="uzi" placeholder="Type a message..." autocomplete="off">
        <button class="send-btn" onclick="kuld()">Küldés</button>
      </div>
    </div>
    <div class="spacer" aria-hidden="true"></div>
